# ════════════════════════════════════════════════════════════════════════
#  Render Deployment Configuration (100% Free Tier Compatible)
#  Sumuka Geleyara Balaga — Ganeshotsava 2026 Website
#
#  HOW TO DEPLOY:
#  1. Push this repo to GitHub
#  2. Go to https://dashboard.render.com → New → Web Service
#  3. Connect your GitHub repository
#  4. Render auto-detects this file and pre-fills Free tier settings
#  5. Add ADMIN_EMAIL & ADMIN_PASSWORD in Render dashboard Environment tab
#  6. Click Deploy
# ════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: sumuka-ganeshotsava-2026
    runtime: node
    plan: free

    # ── Build & Start ────────────────────────────────────────────────
    buildCommand: npm install && npm run build
    startCommand: npm start

    # ── Environment ──────────────────────────────────────────────────
    envVars:
      # Node environment
      - key: NODE_ENV
        value: production

      # Port — Render sets this automatically
      - key: PORT
        generateValue: false

      # ── REQUIRED: Admin Login Credentials ────────────────────────
      # Set your custom admin email and password in Render's Environment tab
      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      # ── OPTIONAL: Google Maps ────────────────────────────────────
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
