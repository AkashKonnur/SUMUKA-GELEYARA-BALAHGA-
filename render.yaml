# ════════════════════════════════════════════════════════════════════════
#  Render Deployment Configuration
#  Sumuka Geleyara Balaga — Ganeshotsava 2026 Website
#
#  HOW TO DEPLOY:
#  1. Push this repo to GitHub
#  2. Go to https://dashboard.render.com → New → Web Service
#  3. Connect your GitHub repository
#  4. Render auto-detects this file and pre-fills settings
#  5. Add Environment Variables in Render dashboard (see .env.example)
#  6. Click Deploy
# ════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: sumuka-ganeshotsava-2026
    runtime: node
    plan: free            # Note: Render Persistent Disks require a paid instance plan (e.g. Starter).
                          # If using the Free plan, files will save but reset on redeployment.

    # ── Build & Start ────────────────────────────────────────────────
    buildCommand: npm install && npm run build
    startCommand: npm start

    # ── Environment ──────────────────────────────────────────────────
    envVars:
      # Node environment
      - key: NODE_ENV
        value: production

      # Port — Render sets this automatically
      - key: PORT
        generateValue: false

      # ── REQUIRED: Admin Login Credentials ────────────────────────
      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      # ── Persistent Storage Directory ─────────────────────────────
      # Mounts the Render Persistent Disk so CMS changes are preserved.
      - key: DATA_DIR
        value: /data

      # ── OPTIONAL: Google Maps ────────────────────────────────────
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false

    # ── Persistent Disk (Optional but Recommended) ───────────────────
    # Keeps your admin CMS changes safe when the site restarts or rebuilds.
    # Note: Requires a Render "Starter" or higher web service type.
    disk:
      name: sumuka-data
      mountPath: /data
      sizeGB: 1
