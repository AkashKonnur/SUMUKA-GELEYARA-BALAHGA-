# ════════════════════════════════════════════════════════════════════════
#  Render Deployment Configuration
#  Sumuka Geleyara Balaga — Ganeshotsava 2026 Website
#
#  HOW TO DEPLOY:
#  1. Push this repo to GitHub
#  2. Go to https://dashboard.render.com → New → Web Service
#  3. Connect your GitHub repository
#  4. Render auto-detects this file and pre-fills settings
#  5. Add Environment Variables in Render dashboard (see .env.example)
#  6. Click Deploy
# ════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: sumuka-ganeshotsava-2026
    runtime: node
    plan: free            # Change to "starter" or higher for production traffic

    # ── Build & Start ────────────────────────────────────────────────
    buildCommand: npm install && npm run build
    startCommand: npm start

    # ── Environment ──────────────────────────────────────────────────
    envVars:
      # Node environment
      - key: NODE_ENV
        value: production

      # Port — Render sets this automatically; Next.js reads it automatically
      - key: PORT
        generateValue: false   # Render injects this; do NOT override

      # ── REQUIRED: Admin Login Credentials ────────────────────────
      # Set these in the Render dashboard → Environment tab
      - key: ADMIN_EMAIL
        sync: false            # Must be set manually in Render dashboard

      - key: ADMIN_PASSWORD
        sync: false            # Must be set manually in Render dashboard

      # ── OPTIONAL: Firebase (for live CMS features) ────────────────
      # Without Firebase, site works with static fallback data
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false

      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false

      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false

      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false

      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false

      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false

      # ── OPTIONAL: Google Maps ────────────────────────────────────
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
