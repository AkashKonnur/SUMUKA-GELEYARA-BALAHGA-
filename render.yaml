# ════════════════════════════════════════════════════════════════════════
#  Render Deployment Configuration (Free Tier Compatible)
#  Sumuka Geleyara Balaga — Ganeshotsava 2026 Website
#
#  HOW TO DEPLOY:
#  1. Push this repo to GitHub
#  2. Go to https://dashboard.render.com → New → Web Service
#  3. Connect your GitHub repository
#  4. Render auto-detects this file
#  5. REQUIRED: Add the following 3 env vars in Render dashboard → Environment:
#       ADMIN_EMAIL      — your admin login email
#       ADMIN_PASSWORD   — your admin login password
#       MONGODB_URI      — your MongoDB Atlas connection string
#       (see .env.example for instructions on getting MONGODB_URI)
#  6. Click Deploy
#
#  HEALTH CHECK (keep service alive on free tier):
#  After deploying, go to cron-job.org (free) and create a cron job:
#  URL: https://your-app.onrender.com/api/health
#  Schedule: every 10 minutes
#  This prevents the free Render instance from sleeping.
#  NOTE: Data is stored in MongoDB — it persists even when Render sleeps.
# ════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: sumuka-ganeshotsava-2026
    runtime: node
    plan: free

    # ── Build & Start ────────────────────────────────────────────────
    buildCommand: npm install && npm run build
    startCommand: npm start

    # ── Health Check ─────────────────────────────────────────────────
    healthCheckPath: /api/health

    # ── Environment ──────────────────────────────────────────────────
    envVars:
      # Node environment
      - key: NODE_ENV
        value: production

      # Port — Render sets this automatically
      - key: PORT
        generateValue: false

      # ── REQUIRED: Admin Login Credentials ────────────────────────
      # Set these in the Render dashboard → Environment tab
      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      # ── REQUIRED: MongoDB Atlas Connection String ─────────────────
      # Persistent storage for all CMS data.
      # Get a free M0 cluster at https://cloud.mongodb.com
      # Format: mongodb+srv://user:pass@cluster.xxxxx.mongodb.net/...
      - key: MONGODB_URI
        sync: false

      # ── OPTIONAL: Google Maps ────────────────────────────────────
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
